name: Update NULL2 seat status

on:
  workflow_dispatch:
  schedule:
    - - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: null2-seat-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python check_null2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json docs/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update NULL2 seat status"
            git push
          fi
